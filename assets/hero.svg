<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030712"/><stop offset=".5" stop-color="#10153A"/><stop offset="1" stop-color="#031A2D"/></linearGradient>
 <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#00F5FF"/><stop offset=".5" stop-color="#8B5CFF"/><stop offset="1" stop-color="#00FFB3"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="grid" width="35" height="35" patternUnits="userSpaceOnUse"><path d="M35 0H0V35" fill="none" stroke="#42DFFF" stroke-opacity=".12"/></pattern>
</defs>
<rect width="1200" height="430" rx="25" fill="url(#bg)"/><rect width="1200" height="430" rx="25" fill="url(#grid)"/>
<circle cx="930" cy="200" r="175" fill="#5B3DFF" opacity=".07"><animate attributeName="r" values="150;190;150" dur="7s" repeatCount="indefinite"/></circle>
<g fill="none" stroke="url(#neon)" stroke-width="1.7" opacity=".7">
 <ellipse cx="900" cy="210" rx="235" ry="82" transform="rotate(-25 900 210)"><animateTransform attributeName="transform" type="rotate" from="-25 900 210" to="335 900 210" dur="26s" repeatCount="indefinite"/></ellipse>
 <ellipse cx="900" cy="210" rx="235" ry="82" transform="rotate(40 900 210)"><animateTransform attributeName="transform" type="rotate" from="40 900 210" to="-320 900 210" dur="32s" repeatCount="indefinite"/></ellipse>
 <ellipse cx="900" cy="210" rx="145" ry="220" transform="rotate(70 900 210)"><animateTransform attributeName="transform" type="rotate" from="70 900 210" to="430 900 210" dur="38s" repeatCount="indefinite"/></ellipse>
</g>
<g filter="url(#glow)">
 <circle cx="900" cy="210" r="70" fill="#09172D" stroke="#00F5FF" stroke-width="2.5"/>
 <circle cx="900" cy="210" r="55" fill="#0D2044" stroke="#8B5CFF" stroke-width="1.5"><animate attributeName="r" values="52;58;52" dur="3s" repeatCount="indefinite"/></circle>
 <text x="900" y="204" text-anchor="middle" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="19" font-weight="bold">DEVOPS</text>
 <text x="900" y="226" text-anchor="middle" fill="#00F5FF" font-family="Arial,sans-serif" font-size="10" letter-spacing="3">ENGINEER</text>
 <circle r="9" fill="#00F5FF"><animateMotion dur="8s" repeatCount="indefinite" path="M900 210 m-230 0 a230 80 -25 1 0 460 0 a230 80 -25 1 0 -460 0"/></circle>
 <circle r="7" fill="#00FFB3"><animateMotion dur="6s" repeatCount="indefinite" path="M900 210 m-145 0 a145 220 70 1 0 290 0 a145 220 70 1 0 -290 0"/></circle>
</g>
<g font-family="Arial,sans-serif">
 <text x="60" y="65" fill="#00F5FF" font-size="15" font-weight="bold" letter-spacing="5">CLOUD • AUTOMATION • RELIABILITY</text>
 <text x="55" y="135" fill="#FFFFFF" font-size="43" font-weight="800">DAVATHU PAVAN</text>
 <text x="55" y="185" fill="#FFFFFF" font-size="43" font-weight="800">KUMAR</text>
 <text x="60" y="224" fill="#B6C6E8" font-size="19">Oracle DBA  →  AWS DevOps</text>
 <text x="60" y="267" fill="#00F5FF" font-size="13" font-weight="bold" letter-spacing="2">DESIGN • BUILD • DEPLOY • OBSERVE</text>
 <g>
  <rect x="60" y="300" width="132" height="38" rx="19" fill="#071D35" stroke="#00F5FF"/><text x="126" y="324" text-anchor="middle" fill="#B9FBFF" font-size="12" font-weight="bold">AWS CLOUD</text>
  <rect x="205" y="300" width="132" height="38" rx="19" fill="#151338" stroke="#8B5CFF"/><text x="271" y="324" text-anchor="middle" fill="#D5C8FF" font-size="12" font-weight="bold">TERRAFORM</text>
  <rect x="350" y="300" width="132" height="38" rx="19" fill="#052B28" stroke="#00FFB3"/><text x="416" y="324" text-anchor="middle" fill="#B9FFE8" font-size="12" font-weight="bold">KUBERNETES</text>
 </g>
 <text x="60" y="390" fill="#7085AD" font-size="12" letter-spacing="2">AUTOMATE EVERYTHING. ENGINEER FOR RESILIENCE.</text>
</g>
<g fill="#00F5FF"><circle cx="730" cy="80" r="3"><animate attributeName="opacity" values=".1;1;.1" dur="2s" repeatCount="indefinite"/></circle><circle cx="1100" cy="320" r="4"><animate attributeName="opacity" values="1;.2;1" dur="2.8s" repeatCount="indefinite"/></circle><circle cx="760" cy="355" r="3"><animate attributeName="opacity" values=".2;1;.2" dur="1.7s" repeatCount="indefinite"/></circle></g>
</svg>